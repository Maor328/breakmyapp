<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" role="img" aria-label="Break My App">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1033"/><stop offset="1" stop-color="#0e0820"/>
    </linearGradient>
    <linearGradient id="emblemBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2270"/><stop offset="1" stop-color="#1e1147"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe6a8"/><stop offset="0.5" stop-color="#f5c451"/><stop offset="1" stop-color="#d98a2b"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="760" height="200" rx="28" fill="url(#panel)"/>
  <rect x="1" y="1" width="758" height="198" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- emblem -->
  <g transform="translate(44,40)">
    <rect width="120" height="120" rx="26" fill="url(#emblemBg)"/>
    <rect x="1.5" y="1.5" width="117" height="117" rx="24.5" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
    <path d="M60 20 L90 31 V58 C90 80 77 92 60 99 C43 92 30 80 30 58 V31 Z" fill="url(#shield)" stroke="#ffffff" stroke-opacity="0.9" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M65 27 L54 55 L64 57 L50 93" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="60" cy="59" r="2.6" fill="#fff6df"/>
  </g>

  <!-- wordmark -->
  <text x="206" y="104" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="54" font-weight="800" letter-spacing="0.5">
    <tspan fill="#f5f3ff">BREAK</tspan><tspan fill="#f5f3ff"> MY </tspan><tspan fill="url(#gold)">APP</tspan>
  </text>
  <rect x="208" y="118" width="86" height="4" rx="2" fill="url(#gold)"/>
  <text x="300" y="121" font-family="'Segoe UI',system-ui,sans-serif" font-size="15" font-weight="600" letter-spacing="5" fill="#a99fd6">BREAK IT BEFORE THEY DO</text>
  <text x="208" y="150" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14.5" fill="#7c7399">25 attackers · survival score · fix report</text>
</svg>
