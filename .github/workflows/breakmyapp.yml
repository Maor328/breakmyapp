# Run Break My App against your app on every push and fail the build on a critical finding.
# Edit the two marked lines to start YOUR app and point at its port.
name: break-my-app

on: [push, pull_request]

jobs:
  break:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1) start YOUR app in the background (replace this line)
      - name: Start app
        run: |
          npm ci || true
          # e.g. npm start &  — start your real app here, on localhost
          node demo/secure-server.mjs & # <-- replace with your app's start command
      - name: Wait for it
        run: npx --yes wait-on http-get://localhost:3000

      # 2) attack it. breakmyapp exits non-zero on any CRITICAL finding or if the server dies.
      - name: Break my app
        run: node bin/breakmyapp.mjs localhost:3000 --delay 0 --json report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breakmyapp-report
          path: report.json
